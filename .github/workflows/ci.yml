name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Check
        run: moon check
      - name: Test (native)
        run: moon test --target native
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Build
        run: moon build --target native
      - name: Run demo
        run: moon run cmd/main --target native
