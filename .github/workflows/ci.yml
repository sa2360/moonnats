name: CI


on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@v1
      - name: Update registry index
        run: moon update
      - name: Check
        run: moon check
      - name: Test (native)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # Running every native test in one process can deadlock the async
          # client event loop. Run the protocol-only package tests separately;
          # client tests are isolated below and against real servers.
          for file in \
            connect_test.mbt \
            encode_test.mbt \
            headers_test.mbt \
            inbox_test.mbt \
            info_test.mbt \
            parser_test.mbt \
            protocol_test.mbt \
            readme_examples_test.mbt \
            subject_test.mbt; do
            echo "=== native protocol tests: $file"
            timeout 60 moon test --target native --no-parallelize "$file"
          done
      - name: Install and start nats-server (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -sL -o nats-server.tgz https://github.com/nats-io/nats-server/releases/download/v2.10.24/nats-server-v2.10.24-linux-amd64.tar.gz
          tar xzf nats-server.tgz
          sudo mv nats-server-v2.10.24-linux-amd64/nats-server /usr/local/bin/
          cat > "$RUNNER_TEMP/moonnats-cluster-a.conf" <<EOF
          port: 4222
          cluster {
            name: moonnats-ci
            listen: 127.0.0.1:25224
            routes: [nats://127.0.0.1:25225]
          }
          EOF
          cat > "$RUNNER_TEMP/moonnats-cluster-b.conf" <<EOF
          port: 4223
          cluster {
            name: moonnats-ci
            listen: 127.0.0.1:25225
            routes: [nats://127.0.0.1:25224]
          }
          EOF
          nats-server -c "$RUNNER_TEMP/moonnats-cluster-a.conf" &
          nats-server -c "$RUNNER_TEMP/moonnats-cluster-b.conf" &
          nats-server -p 24223 --user test --pass pw &
          mkdir -p "$RUNNER_TEMP/moonnats-tls"
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/moonnats-tls/key.pem" \
            -out "$RUNNER_TEMP/moonnats-tls/cert.pem" \
            -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          cat > "$RUNNER_TEMP/moonnats-tls/nats.conf" <<EOF
          port: 24224
          tls {
            cert_file: "$RUNNER_TEMP/moonnats-tls/cert.pem"
            key_file: "$RUNNER_TEMP/moonnats-tls/key.pem"
          }
          EOF
          nats-server -c "$RUNNER_TEMP/moonnats-tls/nats.conf" &
          cat > "$RUNNER_TEMP/moonnats-tls/nats-first.conf" <<EOF
          port: 24225
          tls {
            cert_file: "$RUNNER_TEMP/moonnats-tls/cert.pem"
            key_file: "$RUNNER_TEMP/moonnats-tls/key.pem"
            handshake_first: true
          }
          EOF
          nats-server -c "$RUNNER_TEMP/moonnats-tls/nats-first.conf" &
          sleep 4
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          MOONNATS_INTEGRATION: "1"
          MOONNATS_TLS_INTEGRATION: "1"
          MOONNATS_TLS_CERT: ${{ runner.temp }}/moonnats-tls/cert.pem
          MOONNATS_CLUSTER_INTEGRATION: "1"
        run: |
          set -euo pipefail
          for i in $(seq 0 13); do
            echo "=== integration_wbtest index $i"
            timeout 60 stdbuf -oL moon test --target native client/integration_wbtest.mbt -i "$i" --no-parallelize 2>&1 \
              | grep --line-buffered -E '(=== integration|integration:|Error:|Total tests:)'
          done
      - name: CLI end-to-end (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          moon build --target native cmd/cli
          CLI=_build/native/debug/build/cmd/cli/cli.exe
          NATS_PORT=4222 $CLI pub greetings "hello-from-moonnats"
          echo "CLI publish OK"
      - name: Client tests (individually, to isolate hangs)
        shell: bash
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          for i in $(seq 0 16); do
            echo "=== client_wbtest index $i"
            timeout 60 moon test --target native client/client_wbtest.mbt -i "$i" 2>&1 | tail -3
          done
      - name: Reconnect and recovery tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 0 3); do
            echo "=== reconnect_wbtest index $i"
            timeout 60 moon test --target native client/reconnect_wbtest.mbt -i "$i" --no-parallelize
          done
      - name: Test (wasm-gc)
        run: moon test --target wasm-gc
      - name: Build
        run: moon build --target native
      - name: Run demo
        run: moon run cmd/main --target native
